name: Build and deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NEXT_PUBLIC_* variables are baked into the client bundle at build
      # time, so they must be present here — set them as GitHub repo
      # Secrets (Settings → Secrets and variables → Actions), not just in
      # a local .env.local (which never leaves your machine).
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_NOTIFY_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_NOTIFY_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_AUTOREPLY_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_AUTOREPLY_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ./public_html/
